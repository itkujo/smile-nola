# =============================================================================
# Smile NOLA — production compose file (Coolify-ready)
#
# This file is built to be deployed via Coolify's "Docker Compose" app type.
# Coolify owns ALL public routing — it injects its own Traefik labels based
# on the Domain you set in the Coolify UI, then routes traffic to whatever
# port we `expose` here. That means this file is intentionally domain-
# agnostic so the same compose can ship to prod, staging, or a preview env
# without edits.
#
# WHAT YOU SET IN COOLIFY UI (NOT here):
#   • Domain                      (e.g. https://smile-nola.com)
#   • Environment variables       (see required + optional sets below)
#   • Persistent volume mappings  (or accept the bind mount we declare)
#
# REQUIRED ENV VARS:
#   ADMIN_PASSWORD          — single password gate for /admin/*
#   ADMIN_SESSION_SECRET    — 32+ random bytes; signs the admin cookie
#                             generate with:  openssl rand -hex 32
#
# OPTIONAL ENV VARS:
#   NOTIFY_EMAIL            — where new inquiries get emailed (best-effort)
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS  — SMTP relay; if any is
#                             blank the server logs inquiries to stdout and
#                             still writes them to SQLite
#
# WHAT PERSISTS ACROSS DEPLOYS:
#   • data/leads.db                       — SQLite (inquiries, portfolio
#                                           items, testimonials, booth leads)
#   • data/uploads/portfolio/<id>.jpg     — admin-uploaded portfolio thumbnails
#
# Both live under one host directory (./data) which is bind-mounted at /data
# inside the container. Coolify keeps this directory between redeploys.
# =============================================================================

services:
  site:
    build:
      context: ./apps/site
      dockerfile: Dockerfile
    image: smile-nola/site:latest
    restart: unless-stopped

    environment:
      # ---- Astro / Node server -----------------------------------------------
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"

      # ---- Persistent data location ------------------------------------------
      # SQLite DB + uploaded thumbnails both live under this directory inside
      # the container, mounted from the host volume below.
      SMILE_NOLA_DB_DIR: "/data"

      # ---- Admin auth (REQUIRED) ---------------------------------------------
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}

      # ---- Inquiry email notifications (OPTIONAL) ----------------------------
      # If any are blank, the app skips SMTP and just writes to SQLite.
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

    volumes:
      # Persistent host directory — survives container rebuilds + redeploys.
      # Coolify treats this as a managed bind mount; the path on disk is
      # whatever directory Coolify allocates for the application.
      - ./data:/data

    expose:
      # Coolify reads this and wires Traefik to route the configured Domain
      # → this internal port. We do NOT publish a host port — Coolify's
      # reverse proxy is the only public entrypoint.
      - "3000"

    healthcheck:
      # Node 22 has native fetch — no extra deps needed for the probe.
      # A 2xx response from the homepage means the SSR pipeline + DB
      # bootstrap both succeeded.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
