# =============================================================================
# Smile NOLA — production compose file (Coolify-ready)
#
# This file is built to be deployed via Coolify's "Docker Compose" app type.
# Coolify owns ALL public routing — it injects its own Traefik labels based
# on the Domain you set in the Coolify UI, then routes traffic to whatever
# port we `expose` here. That means this file is intentionally domain-
# agnostic so the same compose can ship to prod, staging, or a preview env
# without edits.
#
# WHAT YOU SET IN COOLIFY UI (NOT here):
#   • Domain                      (e.g. https://smile-nola.com)
#   • Environment variables       (see required + optional sets below)
#
# REQUIRED ENV VARS:
#   ADMIN_PASSWORD          — single password gate for /admin on both
#                             smile-nola.com and expo.smile-nola.com.
#   ADMIN_SESSION_SECRET    — 32+ random bytes; signs the admin cookies
#                             generate with:  openssl rand -hex 32
#   INTAKE_SYNC_TOKEN       — bearer token used by the booth (intake) to
#                             authenticate when pushing captured leads to
#                             the prod sync endpoint. Same value on both
#                             services. Generate with: openssl rand -hex 32
#
# OPTIONAL ENV VARS:
#   RESEND_API_KEY          — Resend SDK key for outbound notifications.
#                             Missing => console fallback (submission still
#                             persists; no email sent).
#   RESEND_FROM             — Sender for outbound mail. Defaults to
#                             "Smile NOLA <onboarding@resend.dev>".
#                             Production should set this to a verified
#                             domain sender.
#   NOTIFY_EMAIL            — Recipient for inquiry / submission alerts.
#
# WHAT PERSISTS ACROSS DEPLOYS (in the smile_nola_data named volume):
#   • /data/leads.db                       — Unified SQLite (inquiries
#                                            from all sources, portfolio,
#                                            testimonials, package builder
#                                            submissions, invites)
#   • /data/uploads/portfolio/<id>.jpg     — admin-uploaded portfolio thumbnails
#
# Two services share that volume:
#   site    — Astro marketing site + package builder + admin
#             (smile-nola.com)
#   intake  — Next.js booth intake (expo.smile-nola.com). Writes booth
#             captures to inquiries with source='booth-expo'. In offline
#             expo scenarios the booth runs locally and replicates to
#             this prod service via the INTAKE_SYNC_TOKEN-gated endpoint.
# =============================================================================

services:
  site:
    build:
      context: ./apps/site
      dockerfile: Dockerfile
    image: smile-nola/site:latest
    restart: unless-stopped

    environment:
      # ---- Astro / Node server -----------------------------------------------
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"

      # ---- Persistent data location ------------------------------------------
      # SQLite DB + uploaded thumbnails both live under this directory inside
      # the container, backed by the named volume mounted below.
      SMILE_NOLA_DB_DIR: "/data"

      # ---- Public origin override (OPTIONAL) ---------------------------------
      # Used by endpoints that ship shareable absolute URLs back to admins
      # (e.g. the "Copy package builder link" button). The helper in
      # /api/package-builder/invite.ts checks X-Forwarded-Proto +
      # X-Forwarded-Host first (Traefik sets both), so this is a safety net
      # if the proxy config ever drops those headers.
      SITE_PUBLIC_URL: ${SITE_PUBLIC_URL:-}

      # ---- Admin auth (REQUIRED) ---------------------------------------------
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}

      # ---- Booth -> prod sync (REQUIRED) -------------------------------------
      # Static bearer the booth uses to push captured leads. Must match the
      # value on the `intake` service. Rotate by setting a new value in the
      # Coolify env and redeploying both services together.
      INTAKE_SYNC_TOKEN: ${INTAKE_SYNC_TOKEN}

      # ---- Inquiry / submission email notifications (OPTIONAL) ---------------
      # If RESEND_API_KEY is blank the app falls back to console logging and
      # still persists the submission. SMTP_* are legacy and no longer read.
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}

    volumes:
      # Docker-managed NAMED volume — survives container rebuilds + redeploys.
      #
      # We deliberately do NOT use a bind mount (`./data:/data`) here. With a
      # bind mount, the host directory's ownership (root:root) overlays the
      # image's /data (which we chown'd to app:app in the Dockerfile). The
      # unprivileged `app` user inside the container then can't write to it,
      # better-sqlite3 fails with "unable to open database file", and the
      # healthcheck flatlines. Named volumes don't have this problem because
      # Docker auto-populates them from the image's existing /data on first
      # mount, with ownership intact.
      - smile_nola_data:/data

    expose:
      # Coolify reads this and wires Traefik to route the configured Domain
      # → this internal port. We do NOT publish a host port — Coolify's
      # reverse proxy is the only public entrypoint.
      - "3000"

    healthcheck:
      # Node 22 has native fetch — no extra deps needed for the probe.
      # A 2xx response from the homepage means the SSR pipeline + DB
      # bootstrap both succeeded.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ---------------------------------------------------------------------------
  # intake — booth lead intake (Next.js). Lives at expo.smile-nola.com.
  #
  # Routing: configure a second Coolify "Service" pointing at this compose
  # file with the Service name `intake` and the public Domain
  # expo.smile-nola.com. Traefik will route that hostname to the intake
  # container's exposed port 3000.
  #
  # Shares /data/leads.db with the `site` service via the same named volume.
  # WAL mode (configured in both apps' getDb() init) allows concurrent
  # writers without blocking each other.
  # ---------------------------------------------------------------------------
  intake:
    build:
      context: ./apps/intake
      dockerfile: Dockerfile
    image: smile-nola/intake:latest
    restart: unless-stopped

    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"

      # Shared SQLite location.
      SMILE_NOLA_DB_DIR: "/data"

      # Admin auth: same password + secret as the site so operators only
      # memorize one. Cookie name is `sn_intake` (vs the site's `sn_admin`)
      # so sessions don't bleed across domains.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}

      # Booth -> prod replication.
      # INTAKE_SYNC_URL: where to push captured rows when online. Defaults
      # to the site's sync endpoint at smile-nola.com. Override only if
      # you're standing up a non-default prod target (preview env, etc.).
      INTAKE_SYNC_URL: ${INTAKE_SYNC_URL:-https://smile-nola.com/api/sync/inquiries}
      INTAKE_SYNC_TOKEN: ${INTAKE_SYNC_TOKEN}
      # 0 disables the auto-drain (manual flush only). Default 30000 (30s).
      INTAKE_SYNC_INTERVAL: ${INTAKE_SYNC_INTERVAL:-30000}

    volumes:
      - smile_nola_data:/data

    expose:
      - "3000"

    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  smile_nola_data:
    # Persistent across redeploys. See DEPLOY.md §4 for backup procedure.
